name: Fetch News and Deploy

on:
  schedule:
    # 08:10 and 20:10 Asia/Shanghai. The evening run is a catch-up if the
    # morning run was delayed, skipped by GitHub Actions, or failed upstream.
    - cron: "10 0 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news metadata
        env:
          NEWS_RADAR_TIMEZONE: Asia/Shanghai
          TZ: Asia/Shanghai
        run: |
          digest_date="$(date +%F)"
          echo "Generating digest for ${digest_date} (${TZ})"
          python scripts/generate_digest.py --date "${digest_date}"
          test -s "digests/${digest_date}.md"
          test -s "data/chinese_hot_topics.json"
          test -s "japanese_digests/${digest_date}.md"
          test -s "data/japanese_digests_index.json"

      - name: Commit fetched news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests japanese_digests data
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "Add daily digest $(date +%F)"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              echo "git push failed; retrying in 30 seconds..."
              sleep 30
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp index.html app.js styles.css site.webmanifest .nojekyll *.png *.ico _site/
          cp -R digests japanese_digests _site/
          mkdir -p _site/data
          cp data/*index.json data/chinese_hot_topics.json _site/data/
          cp -R data/hot_topics _site/data/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
