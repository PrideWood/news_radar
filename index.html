<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Radar</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css?v=20261006">
</head>
<body>
  <main class="reader">
    <header><h1>News Radar</h1><p>浏览新闻条目、来源摘要和原文链接</p></header>
    <section class="controls" aria-label="筛选新闻">
      <label>内容<select id="section-select"><option value="articles">英文新闻</option><option value="japanese">日文新闻</option><option value="topics">国内热点</option></select></label>
      <label>日期<select id="date-select"></select></label>
      <label class="search">搜索<input id="digest-search" type="search" placeholder="搜索标题、来源、摘要"></label>
    </section>
    <p id="status" role="status" aria-live="polite">正在加载…</p>
    <section id="article-list" aria-label="新闻条目"></section>
  </main>
  <script src="app.js?v=20261006"></script>
</body>
</html>
